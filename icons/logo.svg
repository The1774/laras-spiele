<?xml version="1.0" encoding="UTF-8"?>
<!-- Logo von „Laras Spiele": Regenbogen auf Flieder-Rosa-Verlauf mit zwei
     Wölkchen und einem Stern. Quelle für icon-192.png und icon-512.png
     (siehe README.md, Abschnitt „Icons erzeugen"). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
    <defs>
        <linearGradient id="himmel" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#e9d5ff"/>
            <stop offset="1" stop-color="#fdf1f8"/>
        </linearGradient>
    </defs>

    <!-- Abgerundeter Hintergrund (iOS rundet selbst, Android maskiert) -->
    <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#himmel)"/>

    <!-- Stern oben links -->
    <path d="M118 96 L128 124 L156 134 L128 144 L118 172 L108 144 L80 134 L108 124 Z" fill="#ffd24a"/>

    <!-- Regenbogen: vier Bögen, von außen nach innen -->
    <g fill="none" stroke-linecap="round">
        <path d="M96 352 A160 160 0 0 1 416 352" stroke="#ff8fcf" stroke-width="30"/>
        <path d="M128 352 A128 128 0 0 1 384 352" stroke="#ffd24a" stroke-width="30"/>
        <path d="M160 352 A96 96 0 0 1 352 352" stroke="#6ec6f0" stroke-width="30"/>
        <path d="M192 352 A64 64 0 0 1 320 352" stroke="#b388eb" stroke-width="30"/>
    </g>

    <!-- Zwei Wölkchen an den Enden -->
    <g fill="#ffffff">
        <ellipse cx="96" cy="362" rx="62" ry="30"/>
        <ellipse cx="72" cy="344" rx="34" ry="26"/>
        <ellipse cx="122" cy="340" rx="36" ry="28"/>
        <ellipse cx="416" cy="362" rx="62" ry="30"/>
        <ellipse cx="392" cy="340" rx="36" ry="28"/>
        <ellipse cx="442" cy="344" rx="34" ry="26"/>
    </g>
</svg>
