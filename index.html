<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Laras Spiele</title>

    <!-- „Zum Home-Bildschirm hinzufügen": App-Manifest (Name, Icon, Vollbild, quer) -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/icon-192.png" type="image/png">

    <!-- iPad/iPhone: Vollbild ohne Browserleiste, eigenes Symbol -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Laras Spiele">
    <meta name="theme-color" content="#e9d5ff">
    <link rel="apple-touch-icon" href="icons/icon-192.png">

    <!-- Verspielte Schrift "Fredoka" (optional, Fallback: Comic Sans MS) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="gemeinsam/basis.css">
    <link rel="stylesheet" href="hub/style.css">
</head>
<body>

<!-- Rahmen, der den Startbildschirm mittig hält; die Bühne darin hat
     eine feste interne Größe (1024 × 768) und wird per JS skaliert. -->
<div id="skalier-rahmen">
    <div id="buehne">

        <!-- Sanfte Wolken und drei kleine Sterne im Hintergrund -->
        <svg class="hintergrund" viewBox="0 0 1024 768" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <g fill="#ffffff" opacity="0.7">
                <ellipse cx="140" cy="90" rx="70" ry="26"/><ellipse cx="180" cy="74" rx="46" ry="24"/>
                <ellipse cx="880" cy="120" rx="80" ry="28"/><ellipse cx="840" cy="102" rx="48" ry="26"/>
                <ellipse cx="520" cy="700" rx="90" ry="26"/><ellipse cx="560" cy="686" rx="50" ry="24"/>
            </g>
            <path class="stern" d="M60 300 L64 312 L76 316 L64 320 L60 332 L56 320 L44 316 L56 312 Z" fill="#ffd24a" opacity="0.8"/>
            <path class="stern" d="M960 420 L963 428 L971 431 L963 434 L960 442 L957 434 L949 431 L957 428 Z" fill="#ff8fcf" opacity="0.8"/>
            <path class="stern" d="M500 60 L503 68 L511 71 L503 74 L500 82 L497 74 L489 71 L497 68 Z" fill="#b388eb" opacity="0.8"/>
        </svg>

        <!-- Ton an/aus – klein, oben links. Der Zustand gilt für alle Spiele. -->
        <button id="ton-knopf" class="ton-knopf" title="Ton an/aus" aria-label="Ton an/aus">
            <svg viewBox="0 0 40 40" width="36" height="36" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M8 16 h7 l8 -7 v22 l-8 -7 h-7 Z" fill="none" stroke="#2b2b3a" stroke-width="3" stroke-linejoin="round"/>
                <g class="ton-wellen">
                    <path d="M28 14 q6 6 0 12 M31 9 q10 11 0 22" fill="none" stroke="#2b2b3a" stroke-width="3" stroke-linecap="round"/>
                </g>
                <!-- Durchgestrichen, wenn stumm -->
                <path class="ton-strich" d="M8 32 L34 6" stroke="#e0507a" stroke-width="4" stroke-linecap="round"/>
            </svg>
        </button>

        <h1>Laras Spiele</h1>

        <!-- ===== Kachel 1: Laras Zauberwiese ===== -->
        <button class="kachel kachel-zauberwiese" data-ziel="./zauberwiese/index.html" aria-label="Laras Zauberwiese starten">
            <svg viewBox="0 0 420 520" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <!-- Sonne, Wölkchen, Wiese, Blumen -->
                <circle cx="340" cy="80" r="40" fill="#ffe066"/>
                <ellipse cx="90" cy="110" rx="46" ry="18" fill="#ffffff" opacity="0.9"/>
                <path d="M0 300 Q210 250 420 300 L420 520 L0 520 Z" fill="#8fd48a"/>
                <g stroke="#2b2b3a" stroke-width="3">
                    <circle cx="50" cy="360" r="12" fill="#ff8fcf"/><circle cx="50" cy="360" r="4" fill="#ffd24a" stroke="none"/>
                    <circle cx="370" cy="380" r="12" fill="#b388eb"/><circle cx="370" cy="380" r="4" fill="#ffd24a" stroke="none"/>
                    <circle cx="90" cy="450" r="10" fill="#ffd24a"/><circle cx="90" cy="450" r="3.5" fill="#ff8fcf" stroke="none"/>
                    <circle cx="330" cy="470" r="10" fill="#ff8fcf"/><circle cx="330" cy="470" r="3.5" fill="#ffd24a" stroke="none"/>
                </g>
                <!-- Regenbogen -->
                <path d="M100 210 A110 110 0 0 1 320 210" stroke="#ff8fcf" stroke-width="10" fill="none" opacity="0.8"/>
                <path d="M112 210 A98 98 0 0 1 308 210" stroke="#ffd24a" stroke-width="10" fill="none" opacity="0.8"/>
                <path d="M124 210 A86 86 0 0 1 296 210" stroke="#6ec6f0" stroke-width="10" fill="none" opacity="0.8"/>
                <path d="M136 210 A74 74 0 0 1 284 210" stroke="#b388eb" stroke-width="10" fill="none" opacity="0.8"/>

                <!-- Bella, das Einhorn (Vorderansicht) -->
                <g transform="translate(70 180) scale(0.9)">
                    <defs>
                        <linearGradient id="hornHub" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0" stop-color="#ffd24a"/><stop offset="1" stop-color="#ff8fb0"/>
                        </linearGradient>
                    </defs>
                    <ellipse cx="160" cy="284" rx="84" ry="10" fill="#5fae5a" opacity="0.5"/>
                    <ellipse cx="160" cy="236" rx="64" ry="48" fill="#ffffff" stroke="#2b2b3a" stroke-width="4"/>
                    <ellipse cx="132" cy="272" rx="17" ry="12" fill="#b59bd6" stroke="#2b2b3a" stroke-width="4"/>
                    <!-- Rechtes Vorderbein: winkt beim Laden (CSS-Animation "winken") -->
                    <g class="winke-arm">
                        <rect x="176" y="236" width="24" height="40" rx="12" fill="#ffffff" stroke="#2b2b3a" stroke-width="4"/>
                        <ellipse cx="188" cy="272" rx="17" ry="12" fill="#b59bd6" stroke="#2b2b3a" stroke-width="4"/>
                    </g>
                    <!-- Mähne -->
                    <circle cx="98" cy="112" r="17" fill="#ff8fbf" stroke="#2b2b3a" stroke-width="4"/>
                    <circle cx="90" cy="146" r="16" fill="#ffd24a" stroke="#2b2b3a" stroke-width="4"/>
                    <circle cx="98" cy="180" r="15" fill="#6ec6f0" stroke="#2b2b3a" stroke-width="4"/>
                    <circle cx="222" cy="112" r="17" fill="#b388eb" stroke="#2b2b3a" stroke-width="4"/>
                    <circle cx="230" cy="146" r="16" fill="#ff8fbf" stroke="#2b2b3a" stroke-width="4"/>
                    <circle cx="222" cy="180" r="15" fill="#ffd24a" stroke="#2b2b3a" stroke-width="4"/>
                    <!-- Ohren und Horn -->
                    <path d="M110 84 L116 40 L142 74 Z" fill="#ffffff" stroke="#2b2b3a" stroke-width="4" stroke-linejoin="round"/>
                    <path d="M210 84 L204 40 L178 74 Z" fill="#ffffff" stroke="#2b2b3a" stroke-width="4" stroke-linejoin="round"/>
                    <path d="M148 68 L160 14 L172 68 Z" fill="url(#hornHub)" stroke="#2b2b3a" stroke-width="4" stroke-linejoin="round"/>
                    <!-- Kopf -->
                    <circle cx="160" cy="142" r="82" fill="#ffffff" stroke="#2b2b3a" stroke-width="4"/>
                    <circle cx="130" cy="76" r="16" fill="#ff8fbf" stroke="#2b2b3a" stroke-width="4"/>
                    <circle cx="112" cy="98" r="14" fill="#6ec6f0" stroke="#2b2b3a" stroke-width="4"/>
                    <!-- Fröhlich geschlossene Augen, Wangen, Lächeln -->
                    <path d="M112 150 Q135 130 158 150" stroke="#2b2b3a" stroke-width="5" fill="none" stroke-linecap="round"/>
                    <path d="M162 150 Q185 130 208 150" stroke="#2b2b3a" stroke-width="5" fill="none" stroke-linecap="round"/>
                    <circle cx="110" cy="176" r="12" fill="#ff9ec2" opacity="0.7"/>
                    <circle cx="210" cy="176" r="12" fill="#ff9ec2" opacity="0.7"/>
                    <path d="M146 182 Q160 198 174 182" stroke="#2b2b3a" stroke-width="4" fill="none" stroke-linecap="round"/>
                </g>
            </svg>
        </button>

        <!-- ===== Kachel 2: Leo Ella (Platzhalter – das Spiel kommt später) ===== -->
        <button class="kachel kachel-leo" data-ziel="./leo-ella/index.html" aria-label="Leo Ella starten">
            <svg viewBox="0 0 420 520" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <!-- Pünktchen-Tapete -->
                <g fill="#ffffff" opacity="0.9">
                    <circle cx="40" cy="60" r="2"/><circle cx="120" cy="30" r="2"/><circle cx="200" cy="70" r="2"/><circle cx="300" cy="40" r="2"/><circle cx="380" cy="90" r="2"/>
                    <circle cx="70" cy="140" r="2"/><circle cx="160" cy="120" r="2"/><circle cx="260" cy="150" r="2"/><circle cx="350" cy="170" r="2"/><circle cx="30" cy="230" r="2"/>
                    <circle cx="390" cy="250" r="2"/><circle cx="110" cy="260" r="2"/><circle cx="330" cy="290" r="2"/>
                </g>
                <!-- Hausbett-Ecke -->
                <path d="M300 200 L360 140 L420 200 Z" fill="#d6b9b2"/>
                <path d="M300 200 L360 140 L420 200" stroke="#ffffff" stroke-width="8" fill="none" stroke-linejoin="round"/>
                <rect x="304" y="200" width="116" height="80" fill="#d6b9b2"/>
                <rect x="304" y="280" width="116" height="34" fill="#efe6dc"/>
                <rect x="300" y="310" width="120" height="10" fill="#ffffff"/>
                <!-- Altrosa Teppich -->
                <ellipse cx="200" cy="440" rx="180" ry="46" fill="#e3c4c9"/>

                <!-- Leo Ella, der kleine Leopard, sitzt -->
                <g transform="translate(60 150) scale(0.9)">
                    <ellipse cx="160" cy="284" rx="86" ry="10" fill="#b89aa0" opacity="0.5"/>
                    <!-- Schwanz -->
                    <path d="M232 250 Q290 250 282 200 Q276 172 250 184" stroke="#2b2b3a" stroke-width="18" fill="none" stroke-linecap="round"/>
                    <path d="M232 250 Q290 250 282 200 Q276 172 250 184" stroke="#ffd98a" stroke-width="10" fill="none" stroke-linecap="round"/>
                    <circle cx="270" cy="236" r="5" fill="#5a3a22"/><circle cx="283" cy="210" r="5" fill="#5a3a22"/>
                    <!-- Körper mit hellem Bauch -->
                    <ellipse cx="160" cy="240" rx="72" ry="46" fill="#ffd98a" stroke="#2b2b3a" stroke-width="4"/>
                    <ellipse cx="160" cy="250" rx="38" ry="26" fill="#fff6e6"/>
                    <circle cx="104" cy="230" r="7" fill="#c98a4a" stroke="#5a3a22" stroke-width="3.5"/>
                    <circle cx="216" cy="230" r="7" fill="#c98a4a" stroke="#5a3a22" stroke-width="3.5"/>
                    <ellipse cx="126" cy="274" rx="20" ry="12" fill="#ffd98a" stroke="#2b2b3a" stroke-width="4"/>
                    <!-- Rechte Pfote: winkt beim Laden -->
                    <g class="winke-arm">
                        <rect x="180" y="236" width="28" height="40" rx="14" fill="#ffd98a" stroke="#2b2b3a" stroke-width="4"/>
                        <ellipse cx="194" cy="274" rx="20" ry="12" fill="#ffd98a" stroke="#2b2b3a" stroke-width="4"/>
                    </g>
                    <!-- Runde Öhrchen -->
                    <circle cx="100" cy="86" r="30" fill="#ffd98a" stroke="#2b2b3a" stroke-width="4"/><circle cx="100" cy="86" r="16" fill="#ff9ec2"/>
                    <circle cx="220" cy="86" r="30" fill="#ffd98a" stroke="#2b2b3a" stroke-width="4"/><circle cx="220" cy="86" r="16" fill="#ff9ec2"/>
                    <!-- Kopf mit Rosetten-Flecken -->
                    <circle cx="160" cy="150" r="84" fill="#ffd98a" stroke="#2b2b3a" stroke-width="4"/>
                    <circle cx="98" cy="128" r="7" fill="#c98a4a" stroke="#5a3a22" stroke-width="3.5"/><circle cx="90" cy="158" r="5" fill="#5a3a22"/>
                    <circle cx="222" cy="128" r="7" fill="#c98a4a" stroke="#5a3a22" stroke-width="3.5"/><circle cx="230" cy="158" r="5" fill="#5a3a22"/>
                    <circle cx="132" cy="86" r="6" fill="#c98a4a" stroke="#5a3a22" stroke-width="3.5"/><circle cx="160" cy="74" r="5" fill="#5a3a22"/>
                    <circle cx="188" cy="86" r="6" fill="#c98a4a" stroke="#5a3a22" stroke-width="3.5"/>
                    <!-- Schleife -->
                    <ellipse cx="212" cy="46" rx="16" ry="11" fill="#ff8fcf" stroke="#2b2b3a" stroke-width="4" transform="rotate(-30 212 46)"/>
                    <ellipse cx="240" cy="58" rx="16" ry="11" fill="#ff8fcf" stroke="#2b2b3a" stroke-width="4" transform="rotate(30 240 58)"/>
                    <circle cx="226" cy="54" r="7" fill="#ffd24a" stroke="#2b2b3a" stroke-width="3"/>
                    <!-- Schnauze, große Glanzaugen, Wangen, Näschen, Mund, Schnurrhaare -->
                    <ellipse cx="160" cy="186" rx="34" ry="24" fill="#fff6e6"/>
                    <ellipse cx="132" cy="146" rx="21" ry="26" fill="#ffffff" stroke="#2b2b3a" stroke-width="4"/>
                    <circle cx="134" cy="149" r="14" fill="#2b2b3a"/><circle cx="129" cy="142" r="5" fill="#ffffff"/><circle cx="138" cy="153" r="2.5" fill="#ffffff"/>
                    <ellipse cx="188" cy="146" rx="21" ry="26" fill="#ffffff" stroke="#2b2b3a" stroke-width="4"/>
                    <circle cx="190" cy="149" r="14" fill="#2b2b3a"/><circle cx="185" cy="142" r="5" fill="#ffffff"/><circle cx="194" cy="153" r="2.5" fill="#ffffff"/>
                    <circle cx="102" cy="182" r="12" fill="#ff9ec2" opacity="0.7"/><circle cx="218" cy="182" r="12" fill="#ff9ec2" opacity="0.7"/>
                    <path d="M152 178 L168 178 L160 188 Z" fill="#ff8fcf" stroke="#2b2b3a" stroke-width="3" stroke-linejoin="round"/>
                    <path d="M146 194 Q153 204 160 194 Q167 204 174 194" stroke="#2b2b3a" stroke-width="4" fill="none" stroke-linecap="round"/>
                    <path d="M60 176 L100 186 M60 196 L100 196" stroke="#2b2b3a" stroke-width="3" stroke-linecap="round"/>
                    <path d="M260 176 L220 186 M260 196 L220 196" stroke="#2b2b3a" stroke-width="3" stroke-linecap="round"/>
                </g>
            </svg>
        </button>

    </div>
</div>

<!-- Klassisches Script-Tag – KEINE ES-Module, damit alles per Doppelklick (file://) läuft -->
<script src="gemeinsam/speicher.js"></script>
<script src="gemeinsam/audio.js"></script>
<script src="hub/hub.js"></script>

</body>
</html>
