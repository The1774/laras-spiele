    <style>
        /* Platzhalter-Seite: Leo sitzt in seinem Zimmer und wartet.

        * { margin: 0; padding: 0; box-sizing: border-box; }

            align-items: center;

            gap: 12px;
            -webkit-user-select: none;
            user-select: none;
            touch-action: manipulation;
        }
        h1 { font-size: 40px; color: #6d3fb8; }
        p  { font-size: 22px; color: #4a4a5a; }
        svg.leo { width: 320px; height: 300px; }

        /* Haus-Knopf: zurück zum Startbildschirm */
        .haus-knopf {
            position: absolute;
            left: 16px;
            top: 16px;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            border: 4px solid #2b2b3a;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
        }
        .haus-knopf:active { transform: scale(0.92); }
    </style>
</head>
